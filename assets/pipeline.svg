<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Animated process: application testing and security testing run in parallel and meet at a quality gate">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1a"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14f1d9" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#14f1d9" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="300" rx="14" fill="url(#bg)" stroke="#00e5ff" stroke-opacity=".35"/>
<text x="60" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#00e5ff" letter-spacing="2">APPLICATION TESTING</text>
<text x="60" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#14f1d9" letter-spacing="2">SECURITY TESTING</text>
<path id="la" d="M60 95 H1025 L1085 155" fill="none" stroke="#00e5ff" stroke-opacity=".35" stroke-width="1.5"/>
<path id="ls" d="M60 215 H1025 L1085 155" fill="none" stroke="#14f1d9" stroke-opacity=".35" stroke-width="1.5"/><g>
<rect x="64" y="69" width="172" height="52" rx="10" fill="#0a0f1a" stroke="#00e5ff" stroke-width="1.6" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" keyTimes="0;0.040;0.110;0.190;1" values="0.25;0.25;1;0.25;0.25" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="150" y="92" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Requirements</text>
<text x="150" y="110" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">scope + risk</text></g><g>
<rect x="314" y="69" width="172" height="52" rx="10" fill="#0a0f1a" stroke="#00e5ff" stroke-width="1.6" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" keyTimes="0;0.235;0.305;0.385;1" values="0.25;0.25;1;0.25;0.25" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="400" y="92" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Unit + API</text>
<text x="400" y="110" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">pytest, TestNG</text></g><g>
<rect x="564" y="69" width="172" height="52" rx="10" fill="#0a0f1a" stroke="#00e5ff" stroke-width="1.6" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" keyTimes="0;0.430;0.500;0.580;1" values="0.25;0.25;1;0.25;0.25" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="650" y="92" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Contract + UI</text>
<text x="650" y="110" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">Pact, Playwright</text></g><g>
<rect x="814" y="69" width="172" height="52" rx="10" fill="#0a0f1a" stroke="#00e5ff" stroke-width="1.6" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" keyTimes="0;0.626;0.696;0.776;1" values="0.25;0.25;1;0.25;0.25" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="900" y="92" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Performance</text>
<text x="900" y="110" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">load tests</text></g><g>
<rect x="64" y="189" width="172" height="52" rx="10" fill="#0a0f1a" stroke="#00e5ff" stroke-width="1.6" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" keyTimes="0;0.040;0.110;0.190;1" values="0.25;0.25;1;0.25;0.25" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="150" y="212" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Threat model</text>
<text x="150" y="230" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">assets + abuse cases</text></g><g>
<rect x="314" y="189" width="172" height="52" rx="10" fill="#0a0f1a" stroke="#00e5ff" stroke-width="1.6" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" keyTimes="0;0.235;0.305;0.385;1" values="0.25;0.25;1;0.25;0.25" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="400" y="212" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">SAST triage</text>
<text x="400" y="230" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">static analysis</text></g><g>
<rect x="564" y="189" width="172" height="52" rx="10" fill="#0a0f1a" stroke="#00e5ff" stroke-width="1.6" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" keyTimes="0;0.430;0.500;0.580;1" values="0.25;0.25;1;0.25;0.25" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="650" y="212" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">API checks</text>
<text x="650" y="230" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">BOLA, auth, injection</text></g><g>
<rect x="814" y="189" width="172" height="52" rx="10" fill="#0a0f1a" stroke="#00e5ff" stroke-width="1.6" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" keyTimes="0;0.626;0.696;0.776;1" values="0.25;0.25;1;0.25;0.25" dur="10.0s" repeatCount="indefinite"/></rect>
<text x="900" y="212" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">DAST scan</text>
<text x="900" y="230" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">OWASP ZAP</text></g><g>
<circle cx="1095" cy="155" r="34" fill="#0a0f1a" stroke="#14f1d9" stroke-width="2" filter="url(#glow)">
<animate attributeName="stroke-opacity" keyTimes="0;0.78;0.85;0.97;1" values="0.3;0.3;1;1;0.3" dur="10.0s" repeatCount="indefinite"/></circle>
<path d="M1081 156 l10 10 l20 -22" fill="none" stroke="#14f1d9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="opacity" keyTimes="0;0.82;0.88;0.97;1" values="0;0;1;1;0" dur="10.0s" repeatCount="indefinite"/></path>
<text x="1095" y="211" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3">quality gate</text>
<text x="1095" y="227" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e">coverage + SARIF</text></g><circle r="5" fill="#00e5ff" filter="url(#glow)"><animateMotion dur="10.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#la"/></animateMotion></circle><circle r="5" fill="#14f1d9" filter="url(#glow)"><animateMotion dur="10.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#ls"/></animateMotion></circle>
</svg>